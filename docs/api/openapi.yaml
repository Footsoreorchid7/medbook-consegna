# MedBook — contratto ricavato dal codice.
openapi: 3.1.0
info:
  title: MedBook — API implementate
  version: 1.0.0
  description: 'Specifica ricavata dal backend Java al commit 1aecbf3bf9a221267b0c0ba41251d6c984a7941d (Git inizialmente
    pulito), 26 ottobre 2026. Analisi statica di Main, controller, DTO, policy, servizi e test; nessuna esecuzione
    dei test applicativi attestata.


    Autenticazione con cookie HttpOnly SameSite=Lax, Path=/: medbook_local_session in local-http oppure __Host-medbook_session
    con Secure in modalità https. Le alternative OpenAPI rappresentano due configurazioni, non due cookie da usare
    insieme. Sessioni in memoria: inattività 30 minuti, durata assoluta 8 ore; riavvio backend = nuova autenticazione.
    Nessun Bearer/JWT.


    Login e GET /api/auth/me restituiscono X-CSRF-Token negli header. Tutte le modifiche protette richiedono Origin
    esattamente uguale a MEDBOOK_AUTH_ORIGIN e X-CSRF-Token della sessione. Login anonimo e registrazione richiedono
    Origin; login con sessione già valida richiede anche CSRF. Nei GET protetti Origin, se presente, deve coincidere.
    Nessun CORS/OPTIONS applicativo; Swagger ospitato su altra origine è adatto alla consultazione, non al Try it
    out autenticato. I parametri id dell’attore non autenticano: vengono confrontati con la sessione, salvo il medico
    filtrato dal desk.


    Le autorizzazioni indicate per operazione derivano dalla policy; AMMINISTRATORE non eredita DESK. Proprietà
    delle risorse e vincoli di dominio sono ulteriormente verificati nel backend. JSON di errore: {"error":"..."}.
    Non si promette che ogni messaggio sia stabile. Per percorsi sconosciuti 404, metodi non previsti 405 con Allow;
    HEAD/OPTIONS non sono operazioni supportate. I JSON sconosciuti o non validi possono produrre 400; il dettaglio
    delle query e dei controlli varia per controller.


    Date/ore LocalDateTime senza offset; importi numerici in euro. Pagamento online esclusivamente simulato; approvazione
    rimborso amministrativa senza restituzione del denaro. Upload referto come corpo application/pdf, non multipart.
    Nessun endpoint di esecuzione rimborso, generazione referto, configurazione generale o health check è registrato
    in Main.'
  x-source-commit: 1aecbf3bf9a221267b0c0ba41251d6c984a7941d
servers:
- url: /
  description: Stessa origine del backend/proxy MedBook; i percorsi includono /api.
