      description: Origine esatta configurata in MEDBOOK_AUTH_ORIGIN, senza slash finale. Il browser la imposta
        automaticamente.
      schema:
        type: string
      example: http://localhost:8088
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token ottenuto dagli header di login o GET /api/auth/me. Non è il cookie.
      schema:
        type: string
  responses:
    E400:
      description: Richiesta, parametri o documento non validi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E401:
      description: Sessione assente/scaduta/revocata o credenziali non valide.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E403:
      description: Permesso, identità dichiarata, Origin o CSRF non validi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E404:
      description: Risorsa non trovata o non appartenente al chiamante; percorso sconosciuto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E405:
      description: Metodo non consentito; header Allow con i metodi previsti.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Allow:
          schema:
            type: string
    E409:
      description: Conflitto di stato, duplicato o vincolo di dominio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E413:
      description: Corpo troppo grande.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E415:
      description: Content-Type non supportato.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E429:
      description: 'Troppi tentativi; Retry-After: 300.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: string
          description: 'Secondi: 300 per throttling, 60 per capacità sessioni, 5 per contesa account.'
    E500:
      description: Errore interno; esito di una modifica potenzialmente incerto, da verificare prima di ripetere.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    E503:
      description: Servizio temporaneamente non disponibile; Retry-After secondo operazione.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: string
          description: 'Secondi: 300 per throttling, 60 per capacità sessioni, 5 per contesa account.'
