          $ref: '#/components/responses/E500'
        '201':
          description: Operazione completata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrazionePazienteRequest'
      x-source: src/main/java/it/medbook/controller/RegistrazioneController.java
  /api/auth/login:
    post:
      tags:
      - Autenticazione e account
      summary: Autenticarsi
      operationId: post_api_auth_login
      description: 'Autorizzazione: PUBBLICO. Origin obbligatoria. Se il cookie identifica una sessione valida serve
        anche X-CSRF-Token. Corpo massimo 8192 byte; Content-Type non JSON produce 400. Nessuna query.'
      x-permission: PUBBLICO
      parameters:
      - $ref: '#/components/parameters/Origin'
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
        description: Obbligatorio soltanto con sessione precedente valida.
      responses:
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '405':
          $ref: '#/components/responses/E405'
        '429':
          $ref: '#/components/responses/E429'
        '500':
          $ref: '#/components/responses/E500'
        '503':
          description: Capacità sessioni esaurita.
          headers:
            Retry-After:
              schema:
                type: string
              example: '60'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Operazione completata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtenteAutenticatoResponse'
          headers:
            X-CSRF-Token:
              schema:
                type: string
              description: Token da inviare nelle modifiche.
            Set-Cookie:
              schema:
                type: string
              description: Cookie HttpOnly della modalità configurata; valore segreto, non esposto nel JSON.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-source: src/main/java/it/medbook/controller/AutenticazioneController.java
