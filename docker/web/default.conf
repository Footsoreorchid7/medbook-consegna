# Unica origine della demo: frontend compilato e /api inoltrato al backend sulla rete di Compose.
# Origin, cookie e header CSRF passano invariati; il backend resta autorevole sui controlli.
server {
    listen 8080;
    server_name localhost;
    server_tokens off;
    root /usr/share/nginx/html;

    # DNS di Compose: l'indirizzo del backend viene risolto di nuovo dopo un riavvio del servizio.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Referti fino a 10 MiB, più margine per la richiesta.
        client_max_body_size 11m;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Il frontend non dichiara un'icona: risposta vuota invece del fallback HTML.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Rotte Vue: ogni percorso non statico riceve index.html, mai in cache.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }
}
